org: davidzocom
service: productApi

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
 

functions:

  getProducts:
    handler: functions/getProducts/index.handler
    events:
      - httpApi:
          path: /api/products
          method: GET

  getProductById:
    handler: functions/getProductById/index.handler
    events:
      - httpApi:
          path: /api/products/{id}
          method: GET

  addNewProduct:
    handler: functions/addNewProduct/index.handler
    events:
      - httpApi:
          path: /api/products
          method: POST

  deleteProduct:
    handler: functions/deleteProduct/index.handler
    events:
      - httpApi:
          path: /api/products/{id}
          method: DELETE

  updateProduct:
    handler: functions/updateProduct/index.handler
    events:
      - httpApi:
          path: /api/products/{id}
          method: PUT
  
